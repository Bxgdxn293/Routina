<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Routine Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--card:#0a0a0b;--card2:#151517;--line:#1f1f22;--text:#f4f4f5;--muted:#8b8b90;--faint:#4a4a4f;
  --acc:#c6f03c;--acc2:#a9d32c;--danger:#f87171;--ink:#0a0a00;
  --h0:#141416;--h1:#3a3e0c;--h2:#6d7414;--h3:#aab61b;--h4:#c6f03c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:15px;font-weight:700;margin:26px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.mt{margin-top:12px}.mt2{margin-top:20px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.btn{background:var(--acc);color:var(--ink);font-weight:700;border-radius:14px;padding:13px 18px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #4a2427}
.btn.full{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
/* nav */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav#tabs button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:10.5px;font-weight:600}
nav#tabs button svg{width:22px;height:22px}
nav#tabs button.on{color:var(--acc)}
/* today */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800}
.hcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 12px 12px;margin-bottom:9px;transition:border-color .2s}
.hcard.done{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.hico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent)}
.hmain{flex:1;min-width:0}
.hname{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard.done .hname{color:var(--muted)}
.hsub{color:var(--muted);font-size:13px;margin-top:2px}
.bar{height:5px;border-radius:5px;background:var(--card2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .25s}
.chk{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .15s}
.chk svg{width:22px;height:22px;opacity:0;color:var(--ink)}
.chk.on{background:var(--c);border-color:var(--c)}
.chk.on svg{opacity:1}
.ctr{display:flex;gap:6px;flex:none}
.cbtn{width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:20px;font-weight:600;display:grid;place-items:center}
.cbtn.plus{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.ghead{display:flex;align-items:center;gap:8px;margin:26px 0 10px}
.ghead .gname{font-weight:700;font-size:15px}
.ghead .tag{font-size:11px;font-weight:700;color:var(--acc);background:rgba(198,240,60,.12);padding:3px 7px;border-radius:6px}
.avs{display:flex;margin-top:7px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:2px solid var(--card);margin-left:-5px;background:var(--card2);color:var(--muted)}
.av:first-child{margin-left:0}
.av.on{background:var(--acc);color:var(--ink)}
.free{opacity:.55}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:15px}
/* week */
.wk{width:100%;border-collapse:separate;border-spacing:0 6px}
.wk th{font-size:12px;color:var(--muted);font-weight:600;padding:2px 0}
.wk th.today{color:var(--acc)}
.wk td{padding:0;text-align:center}
.wk td.hn{text-align:left;padding-right:4px;max-width:96px}
.wk td.hn div{max-width:90px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk td.hn span.e{font-size:17px}
.cell{width:30px;height:30px;border-radius:10px;background:var(--card2);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);position:relative;overflow:hidden}
.cell.on{background:var(--c);color:var(--ink)}
.cell.off{background:transparent;border:1px dashed var(--line)}
.cell.fut{opacity:.35}
.cell .fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--c) 45%,transparent)}
.cell em{position:relative;font-style:normal}
.cell svg{width:18px;height:18px}
.wk td.tot{font-size:12px;color:var(--muted);font-weight:600;padding-left:4px;white-space:nowrap}
.pctrow td{font-size:12px;color:var(--muted);font-weight:700}
/* year */
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(min-width:600px){.months{grid-template-columns:repeat(4,1fr)}}
.mon h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.d{aspect-ratio:1;border-radius:3px;background:var(--h0)}
.d.blank{background:transparent}
.d.none{background:#070708;outline:1px solid #18181b;outline-offset:-1px}
.d.l0{background:#3a1414}.d.l1{background:#ef4444}.d.l2{background:#f97316}.d.l3{background:#facc15}.d.l4{background:#22c55e}
.d.td{outline:2px solid var(--text);outline-offset:-1px}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.legend .d{width:12px;height:12px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
.chart{width:100%;margin-top:8px}
.chart svg{display:block}
/* modal */
#modal-root .back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
#modal-root .sheet{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s}
@media(min-width:600px){#modal-root .back{align-items:center}#modal-root .sheet{border-radius:22px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:0 0 14px;font-size:20px}
.lbl{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:var(--text)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emo{width:40px;height:40px;border-radius:11px;background:var(--card2);font-size:20px;border:1px solid var(--line)}
.emo.on{border-color:var(--acc);color:var(--acc)}
.emo.li svg{width:20px;height:20px}
.days{display:flex;gap:6px}
.days button{flex:1;padding:10px 0;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.days button.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.preset{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;font-size:14px;font-weight:600}
.preset.on{border-color:var(--acc);background:rgba(198,240,60,.07)}
.preset span{font-size:20px}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .t{flex:1;min-width:0;font-weight:600}
.lrow .t small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
.mini{width:32px;height:32px;border-radius:10px;background:var(--card2);display:grid;place-items:center}
.mini svg{width:16px;height:16px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--acc)}
.switch.on::after{left:21px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.18em;font-weight:700}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0}
.lb .n{flex:1;font-weight:600}
.lb .pb{flex:1.3;height:8px;background:var(--card2);border-radius:6px;overflow:hidden}
.lb .pb i{display:block;height:100%;background:var(--acc);border-radius:6px}
.lb .p{width:42px;text-align:right;font-size:13px;color:var(--muted);font-weight:700}
.av.big{width:30px;height:30px;font-size:12px;margin:0;border:0}
.li{display:inline-grid;place-items:center;vertical-align:-5px}.li svg{width:22px;height:22px}
.chip .li svg{width:16px;height:16px}.chip .li{vertical-align:-3px;margin-right:2px}
.hico .li,.preset .li{display:grid}
.hico{color:var(--text)}
.hcard.done .hico{color:var(--c)}
.mx-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:thin}
.mx{border-collapse:separate;border-spacing:0 3px}
.mx th{font-size:10px;color:var(--muted);font-weight:600;padding:0 1px;min-width:28px;line-height:1.35}
.mx th.td{color:var(--acc)}
.mx.w7 .mc{width:36px;height:36px;border-radius:9px}.mx.w7 .mc svg{width:20px;height:20px}.mx.w7 th{min-width:40px;font-size:11.5px}
.mx td{padding:0;text-align:center}
.mx td.hn,.mx th.hn{position:sticky;left:0;background:var(--card);z-index:2;box-shadow:-16px 0 0 var(--card),6px 0 8px -4px rgba(0,0,0,.8);text-align:left;padding-right:10px;min-width:0}
.mx td.hn div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.mx td.hn .hi{width:30px;height:30px;justify-content:center;border-radius:8px;background:#151517;font-size:15px;max-width:none!important;color:var(--text)}
.mx td.hn .hi .li svg{width:17px;height:17px;color:var(--text)}
.mx td.hn .li svg,.mx td.hn .e{width:16px;height:16px;font-size:14px;flex:none;color:var(--muted)}
.mx td.gsep{position:sticky;left:0;text-align:left;font-size:11px;color:var(--acc);font-weight:700;padding:10px 0 2px;letter-spacing:.04em}
.mc{width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--muted);position:relative}
.mc svg{width:15px;height:15px;color:var(--acc)}
.mc.miss{background:#1b1b1e}
.mc.today{border:1.5px solid #6b6b70}
.mc.up{background:#0e0e10}
.mc.opt{background:#0e0e10}
.mc.ps::after{content:"";width:5px;height:8px;border-left:2px solid #45454a;border-right:2px solid #45454a}
.mc.ns::after{content:"";width:3px;height:3px;border-radius:50%;background:#4a4a4f}
.mlegend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:10px}
.mlegend span{display:inline-flex;align-items:center;gap:5px}
.mlegend .mc{width:14px;height:14px;border-radius:4px}.mlegend .mc svg{width:11px;height:11px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dash .card{padding:14px}
.k{font-size:11.5px;color:var(--muted);font-weight:600}
.kv{font-size:20px;font-weight:800;margin-top:2px}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.minibars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:8px}
.minibars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.minibars i{display:block;width:100%;max-width:16px;border-radius:4px;background:#3a3a3e;min-height:3px}
.minibars i.t{outline:2px solid var(--text);outline-offset:1px}
.minibars b{font-size:9.5px;color:var(--muted);font-weight:600}
.an{display:flex;align-items:center;gap:10px;padding:7px 0}
.an .n{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an .pb{flex:1.2;height:4px;background:#1b1b1e;border-radius:4px;overflow:hidden}
.an .pb i{display:block;height:100%;background:var(--acc);border-radius:4px}
.an .p{width:40px;text-align:right;font-size:12.5px;font-weight:700}
.an .c{width:44px;text-align:right;font-size:12px;color:var(--muted)}
.an .r{width:22px;font-size:12px;color:var(--muted);font-weight:600}
@media(min-width:760px){#app{max-width:1100px}.dash{grid-template-columns:2fr 1fr 1fr 1fr}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.two .card{margin-top:12px}}
.seg3{max-width:340px;margin-top:16px}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button,.hcard{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hico,.hmain{cursor:pointer}
.hcard:active{transform:scale(.985)}
.hcard{transition:transform .1s,border-color .2s}
@media(max-width:600px){
  .kgrid{grid-template-columns:1fr 1fr;gap:12px}
  h1{font-size:26px}
  .mc{width:28px;height:28px}
  .mx th{min-width:31px}
  .mx td.hn div{max-width:110px;font-size:12.5px}
  .mx.w7 .mc{width:32px;height:32px}.mx.w7 th{min-width:34px}
  .mx.w7 td.hn div{max-width:100px}
  .dash .card{padding:13px}
  .big{font-size:26px}
  .chk{width:46px;height:46px}
  .cbtn{width:42px;height:42px}
  nav#tabs button{font-size:11px}
}
.mono .hico{background:var(--card2)}
.mono .hcard.done .hico{background:rgba(198,240,60,.12)}
.ii{display:inline-flex;vertical-align:-2px;margin-right:3px;color:var(--acc)}.ii svg{width:13px;height:13px}
#toast.act span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
#toast.act{pointer-events:auto;white-space:nowrap;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 16px}
#toast.act button{background:var(--bg);color:var(--acc);font-weight:700;padding:8px 12px;border-radius:9px;font-size:14px}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.nb nav#tabs{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
.nb #app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.nb #toast{bottom:calc(146px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#tip{position:fixed;z-index:70;pointer-events:none;background:#000;border:1px solid var(--line);color:var(--text);font-size:12.5px;padding:7px 9px;border-radius:9px;opacity:0;transition:opacity .1s;white-space:nowrap}
.loading{display:grid;place-items:center;height:70vh;color:var(--muted)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.sync.local i{background:#fbbf24}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><div class="spin"></div>Lade…</div></div></div>
<nav id="tabs"></nav>
<div id="modal-root"></div>
<div id="toast"></div>
<div id="tip"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const wd=d=>(d.getDay()+6)%7;
const weekStart=d=>addDays(d,-wd(d));
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=v=>(+v||0).toLocaleString('de-DE',{maximumFractionDigits:2});
const pct=x=>x==null?'–':Math.round(x*100)+'%';
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const DAYS_L=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

const COLORS=['#c6f03c','#f4f4f5','#60a5fa','#a78bfa','#f472b6','#4ade80','#fb923c','#22d3ee'];

/* ---------- persistence ---------- */
const W={};
function pending(path){const w=W[path];return !!(w&&(w.timer||w.busy))}
function queueWrite(path,getData,delay=500){
  if(MODE!=='cloud')return;
  const w=W[path]||(W[path]={timer:null,busy:false,dirty:false});
  w.getData=getData;clearTimeout(w.timer);
  w.timer=setTimeout(()=>{w.timer=null;flush(path)},delay);
}
async function flush(path){
  const w=W[path];if(w.busy){w.dirty=true;return}
  w.busy=true;
  try{await db.doc(path).set(w.getData())}
  catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await db.doc(path).set(w.getData())}catch(e2){toast('Speichern fehlgeschlagen – bitte später nochmal')}}
    else if(e&&e.code==='invalid_argument'){canWrite=false;toast('Du hast hier keine Schreibrechte')}
    else if(e&&e.code==='quota_exceeded'){toast('Speicher voll – alte Daten löschen')}
    else toast('Speichern fehlgeschlagen');
  }
  w.busy=false;
  if(w.dirty){w.dirty=false;flush(path)}
}

}

/* ---------- habit logic ---------- */
function inRanges(r,k){if(r)for(const p of r)if(k>=p.from&&(!p.to||k<=p.to))return p;return null}
function pauseOf(h,k){return inRanges(h.pauses,k)||(S.habits.includes(h)?inRanges(S.settings.pauses,k):null)}
function isDue(h,d){
  const k=dkey(d);
  if(pauseOf(h,k))return false;
  if(h.start&&k<h.start)return false;
  if(h.end&&k>h.end)return false;
  const f=h.freq||{kind:'daily'};
  if(f.kind==='days')return (f.days||[]).includes(wd(d));
  return true;
}
function isDone(h,v){if(!v)return false;return h.type==='count'?v>=(+h.target||1):v>=1}
const pv=h=>k=>(LOGS[k]||{})[h.id];
const gv=(code,h,id=ME)=>k=>((((GM[id]||{}).logs||{})[code]||{})[k]||{})[h.id];
function weekCount(h,get,d){const ws=weekStart(d);let c=0;for(let i=0;i<7;i++)if(isDone(h,get(dkey(addDays(ws,i)))))c++;return c}
function streakOf(h,get){
  const t=today();
  if(h.freq&&h.freq.kind==='weekly'){
    const tg=h.freq.times||1;let ws=weekStart(t),s=0;
    if(weekCount(h,get,ws)>=tg)s++;
    ws=addDays(ws,-7);
    for(let i=0;i<520;i++){if(h.start&&dkey(addDays(ws,6))<h.start)break;if(weekCount(h,get,ws)>=tg){s++;ws=addDays(ws,-7)}else break}
    return{cur:s,week:true};
  }
  let d=t,s=0;
  if(!isDone(h,get(dkey(d))))d=addDays(d,-1);
  for(let i=0;i<1500;i++){
    if(h.start&&dkey(d)<h.start)break;
    if(!isDue(h,d)){d=addDays(d,-1);continue}
    if(isDone(h,get(dkey(d)))){s++;d=addDays(d,-1)}else break;
  }
  return{cur:s,week:false};
}
function bestStreak(h,get){
  const t=today();let d=h.start?parse(h.start):addDays(t,-365);let best=0,cur=0;
  if(h.freq&&h.freq.kind==='weekly'){
    let ws=weekStart(d);const tg=h.freq.times||1;
    while(ws<=t){if(weekCount(h,get,ws)>=tg){cur++;best=Math.max(best,cur)}else if(ws<weekStart(t))cur=0;ws=addDays(ws,7)}
    return best;
  }
  while(d<=t){if(isDue(h,d)){if(isDone(h,get(dkey(d)))){cur++;best=Math.max(best,cur)}else if(dkey(d)!==dkey(t))cur=0}d=addDays(d,1)}
  return best;
}
function streakTxt(st){if(!st.cur)return'';const u=st.week?(st.cur===1?'Woche':'Wochen'):(st.cur===1?'Tag':'Tage');return `<span class="ii">${I(LI.fire)}</span>${st.cur} ${u}`}
// items: [{h,get}]
function dayScore(k,items){
  const d=parse(k);let n=0,den=0;
  for(const{h,get}of items){
    if(!isDue(h,d))continue;
    const done=isDone(h,get(k));
    if(h.freq&&h.freq.kind==='weekly'){if(done){n++;den++}}
    else{den++;if(done)n++}
  }
  return den?n/den:null;
}
function habitRate(h,get,from,to){ // fraction over range (daily/days: due days; weekly: weeks)
  let n=0,den=0;
  if(h.freq&&h.freq.kind==='weekly'){
    let ws=weekStart(from);const tg=h.freq.times||1;
    while(ws<=to){if(!(h.start&&dkey(addDays(ws,6))<h.start)){den+=tg;n+=Math.min(tg,weekCount(h,get,ws))}ws=addDays(ws,7)}
  }else{
    for(let d=new Date(from);d<=to;d=addDays(d,1)){if(isDue(h,d)){den++;if(isDone(h,get(dkey(d))))n++}}
  }
  return den?n/den:null;
}
function personalItems(){return S.habits.filter(h=>!h.archived).map(h=>({h,get:pv(h)}))}
function myGroupCodes(){return (myGM().groups||[]).filter(c=>GROUPS[c])}
function visibleGroupCodes(){if(!S.settings.showGroups)return[];return myGroupCodes().filter(c=>!(S.settings.hidden||[]).includes(c))}
function membersOf(code){return Object.keys(GM).filter(id=>(GM[id].groups||[]).includes(code))}
function nameOf(id){return id===ME?'Du':(NAMES[id]||'Mitglied')}
function initials(id){const n=id===ME?(NAMES[id]||'Du'):(NAMES[id]||'?');return n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}

/* ---------- values ---------- */
function getVal(ctx,code,hid,k){
  if(ctx==='p')return (LOGS[k]||{})[hid]||0;
  return ((((myGM().logs||{})[code]||{})[k])||{})[hid]||0;
}
function setVal(ctx,code,hid,k,val){
  val=Math.max(0,Math.round(val*100)/100);
  if(ctx==='p'){
    const day={...(LOGS[k]||{})};
    if(val)day[hid]=val;else delete day[hid];
    if(Object.keys(day).length)LOGS[k]=day;else delete LOGS[k];
    saveLog(k);
  }else{
    if(MODE!=='cloud')return;
    const g=clone(myGM());g.logs=g.logs||{};g.logs[code]=g.logs[code]||{};
    const day=g.logs[code][k]||{};
    if(val)day[hid]=val;else delete day[hid];
    if(Object.keys(day).length)g.logs[code][k]=day;else delete g.logs[code][k];
    const cut=dkey(addDays(today(),-120));
    for(const c in g.logs)for(const d in g.logs[c])if(d<cut)delete g.logs[c][d];
    GM[ME]=g;saveGM();
  }
  render();
}
function findHabit(ctx,code,hid){return ctx==='p'?S.habits.find(h=>h.id===hid):((GROUPS[code]||{}).habits||[]).find(h=>h.id===hid)}

function badgeSvg(b,locked,size=56){const c=locked?'#3a3a3e':b.col;return `<svg width="${size}" height="${size}" viewBox="0 0 64 64"><path d="${BHEX[0]}" fill="${c}" fill-opacity="${locked?.06:.16}" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/><path d="${BHEX[1]}" fill="none" stroke="${c}" stroke-opacity=".35" stroke-width="1.2" stroke-linejoin="round"/><g transform="translate(19.4 19.4) scale(1.05)" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${b.ic}</g></svg>`}
const MILES=BADGES.map(b=>b.n),MILES_W=BADGES.map(b=>b.w);
const inClaude=()=>!!(window.claude&&window.claude.use)||/claude/.test(location.hostname);
function change(ctx,code,hid,k,nv,label){
  const h=findHabit(ctx,code,hid);if(!h)return;
  const prev=getVal(ctx,code,hid,k);if(nv===prev)return;
  const wasDone=isDone(h,prev);
  setVal(ctx,code,hid,k,nv);
  const nowDone=isDone(h,getVal(ctx,code,hid,k));
  if(!wasDone&&nowDone){
    try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}
    const st=streakOf(h,ctx==='p'?pv(h):gv(code,h));const ms=st.week?MILES_W:MILES;
    if(ms.includes(st.cur)&&k===dkey(today())){celebrate(h,st);return}
  }
  toastUndo(nowDone?`${h.name} erledigt`:wasDone&&!nowDone?`${h.name} zurückgesetzt`:`${h.name}: ${fmt(getVal(ctx,code,hid,k))} ${h.unit||''}`,()=>setVal(ctx,code,hid,k,prev));
}
function celebrate(h,st){
  const b=BADGES[(st.week?MILES_W:MILES).indexOf(st.cur)]||BADGES[0];

let CHARTS=[];

function lineSvg(s,Wd){
  const H=s.h||170,pl=36,pr=8,pt=10,pb=22,iw=Wd-pl-pr,ih=H-pt-pb,n=s.data.length,max=s.max||1,min=s.min||0;
  const x=i=>pl+(n<2?iw/2:i*iw/(n-1)),y=v=>pt+ih-((Math.min(v,max)-min)/(max-min))*ih;
  let o=`<svg width="${Wd}" height="${H}" font-family="Inter,system-ui" font-size="10.5">`;
  for(const g of [0,.5,1]){const gv_=min+(max-min)*g,gy=y(gv_);o+=`<line x1="${pl}" x2="${Wd-pr}" y1="${gy}" y2="${gy}" stroke="#1f1f22"/><text x="${pl-6}" y="${gy+3.5}" fill="#8b8b90" text-anchor="end">${s.fmtY?s.fmtY(gv_):fmt(gv_)}</text>`}
  let path='',area='',seg=[];const segs=[];
  s.data.forEach((d,i)=>{if(d.v==null){if(seg.length)segs.push(seg);seg=[]}else seg.push([x(i),y(d.v)])});if(seg.length)segs.push(seg);

  if(area)o+=`<path d="${area}" fill="url(#lg)"/>`;
  o+=`<path d="${path}" fill="none" stroke="#c6f03c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  segs.forEach(sg=>{if(sg.length===1)o+=`<circle cx="${sg[0][0]}" cy="${sg[0][1]}" r="4" fill="#c6f03c"/>`});
  if(n<=31&&s.max===1&&!s.min)s.data.forEach((d,i)=>{if(d.v!=null)o+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="3" fill="${pcol(d.v/max)}"/>`});
  const last=[...s.data].map((d,i)=>[d,i]).filter(([d])=>d.v!=null).pop();
  if(last)o+=`<circle cx="${x(last[1])}" cy="${y(last[0].v)}" r="4.5" fill="#c6f03c" stroke="#0a0a0b" stroke-width="2"/>`;
  const every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(iw/34))));
  s.data.forEach((d,i)=>{const cw=n<2?iw:iw/(n-1);o+=`<rect x="${x(i)-cw/2}" y="${pt}" width="${cw}" height="${ih}" fill="transparent" data-tip="${esc(d.tip||'')}"/>`;if(i%every===0)o+=`<text x="${x(i)}" y="${H-6}" fill="#8b8b90" text-anchor="${i===n-1&&n>1?'end':i===0?'start':'middle'}">${esc(d.l)}</text>`});

}
function barSvg(s,Wd){
  const H=s.h||170,pl=36,pr=6,pt=10,pb=22,iw=Wd-pl-pr,ih=H-pt-pb;
  const n=s.data.length,bw=iw/n,max=s.max||Math.max(1,...s.data.map(d=>d.v||0),s.target||0);

  for(const g of [0,.5,1]){const gy=y(max*g);o+=`<line x1="${pl}" x2="${Wd-pr}" y1="${gy}" y2="${gy}" stroke="#1f1f22" stroke-width="1"/><text x="${pl-6}" y="${gy+3.5}" fill="#8b8b90" text-anchor="end">${s.fmtY?s.fmtY(max*g):fmt(max*g)}</text>`}
  const every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(iw/42))));
  s.data.forEach((d,i)=>{
    const x=pl+i*bw,w=Math.max(2,bw-2),bx=x+1;

    if(i%every===0)o+=`<text x="${x+bw/2}" y="${H-6}" fill="#8b8b90" text-anchor="middle">${esc(d.l)}</text>`;
  });
  if(s.target){const ty=y(s.target);o+=`<line x1="${pl}" x2="${Wd-pr}" y1="${ty}" y2="${ty}" stroke="#eceff3" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/><text x="${Wd-pr}" y="${ty+13}" fill="#eceff3" text-anchor="end" opacity=".8">Ziel</text>`}
  return o+'</svg>';
}

function weekAvg(ws,items){const t=dkey(today());const v=[...Array(7)].map((_,i)=>dkey(addDays(ws,i))).filter(k=>k<=t).map(k=>dayScore(k,items)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}

function viewHeute(){

function habitCount(h,get,from,to){
  let n=0,den=0;
  if(h.freq&&h.freq.kind==='weekly'){
    for(let d=new Date(from);d<=to;d=addDays(d,1)){if(isDue(h,d)&&isDone(h,get(dkey(d))))n++}
    let ws=weekStart(from);const tg=h.freq.times||1;
    while(ws<=to){if(!(h.start&&dkey(addDays(ws,6))<h.start)){const a=ws<from?from:ws,e=addDays(ws,6)>to?to:addDays(ws,6);const days=Math.round((e-a)/864e5)+1;den+=Math.round(tg*days/7)}ws=addDays(ws,7)}
    n=Math.min(n,den);
  }else{
    for(let d=new Date(from);d<=to;d=addDays(d,1)){if(isDue(h,d)){den++;if(isDone(h,get(dkey(d))))n++}}
  }

}
function mcell(h,get,d,ctx,code){
  const k=dkey(d),t=dkey(today()),v=get(k)||0,due=isDue(h,d),done=isDone(h,v);
  const weekly=h.freq&&h.freq.kind==='weekly';

  else if(k>t){cls+=' up';st='Kommt noch'}
  else if(k===t){cls+=' today';st='Heute fällig'}
  else if(weekly){cls+=' opt';st='Offen (X× pro Woche)'}
  else{cls+=' miss';st='Verpasst'}
  if(!done&&v&&h.type==='count')inner=`<span>${fmt(v)}</span>`;
  const can=due&&k<=t;
  const act=can?`data-act="cell" data-ctx="${ctx}" data-code="${code||''}" data-hid="${h.id}" data-k="${k}"`:'';
  return `<td><button class="${cls}" ${act} data-tip="${esc(h.name)} · ${d.getDate()}.${d.getMonth()+1}. · ${st}${h.type==='count'?' · '+fmt(v)+' '+esc(h.unit||''):''}">${inner}</button></td>`;
}

/* ---------- habit editor ---------- */
function habitEditor(existing,onSave,opts={}){
  const h=existing?clone(existing):{id:uid(),name:'',emoji:'i:target',color:COLORS[0],type:'check',target:1,unit:'',step:1,freq:{kind:'daily',days:[0,1,2,3,4],times:3}};
  h.freq=Object.assign({kind:'daily',days:[0,1,2,3,4],times:3},h.freq||{});
  const draw=()=>`<h3>${existing?'Bearbeiten':(opts.group?'Gruppen-Gewohnheit / Challenge':'Neue Gewohnheit')}</h3>
    <div class="lbl">Name</div><input id="f-name" maxlength="40" placeholder="z. B. 30 Min. Lesen" value="${esc(h.name)}">
    <div class="lbl">Symbol</div><div class="emojis">${Object.keys(LI).map(n=>`<button class="emo li ${icoName(h.emoji)===n?'on':''}" data-e="i:${n}">${I(LI[n])}</button>`).join('')}</div>
    ${S.settings.colorful?`<div class="lbl">Farbe</div><div class="swatches">${COLORS.map(c=>`<button class="sw ${h.color===c?'on':''}" data-c="${c}" style="background:${c}" aria-label="Farbe"></button>`).join('')}</div>`:''}
    <div class="lbl">Art</div><div class="seg" id="f-type"><button data-v="check" class="${h.type==='check'?'on':''}">✓ Abhaken</button><button data-v="count" class="${h.type==='count'?'on':''}"># Mit Zahl</button></div>
    ${h.type==='count'?`<div class="grid2" style="grid-template-columns:1fr 1fr 1fr;gap:8px"><div><div class="lbl">Tagesziel</div><input id="f-target" type="number" inputmode="decimal" min="0" step="any" value="${h.target}"></div><div><div class="lbl">Einheit</div><input id="f-unit" maxlength="12" placeholder="Liter" value="${esc(h.unit)}"></div><div><div class="lbl">Schritt (+)</div><input id="f-step" type="number" inputmode="decimal" min="0" step="any" value="${h.step||1}"></div></div>`:''}
    <div class="lbl">Wie oft?</div><div class="seg" id="f-freq"><button data-v="daily" class="${h.freq.kind==='daily'?'on':''}">Täglich</button><button data-v="days" class="${h.freq.kind==='days'?'on':''}">Bestimmte Tage</button><button data-v="weekly" class="${h.freq.kind==='weekly'?'on':''}">X× / Woche</button></div>
    ${h.freq.kind==='days'?`<div class="days mt" id="f-days">${DAYS.map((d,i)=>`<button data-i="${i}" class="${h.freq.days.includes(i)?'on':''}">${d}</button>`).join('')}</div>`:''}
    ${h.freq.kind==='weekly'?`<div class="days mt" id="f-times">${[1,2,3,4,5,6].map(n=>`<button data-n="${n}" class="${h.freq.times===n?'on':''}">${n}×</button>`).join('')}</div>`:''}
    ${existing&&!opts.group?`<div class="lbl">Pausieren bis (z. B. krank)</div><input id="f-pause" type="date" min="${dkey(today())}" value="${(()=>{const p=inRanges(h.pauses,dkey(today()))||(h.pauses||[]).find(p=>p.from>dkey(today()));return p&&p.to||''})()}"><div class="note" style="margin-top:6px">Während der Pause zählt der Tag nicht – deine Serie bleibt erhalten. Leer = keine Pause.</div>`:''}
    ${opts.group?`<div class="lbl">Challenge-Zeitraum (optional)</div><div class="grid2"><input id="f-start" type="date" value="${h.start||''}"><input id="f-end" type="date" value="${h.end||''}"></div><div class="note" style="margin-top:6px">Leer lassen = dauerhafte Gruppen-Gewohnheit. Mit Enddatum = Challenge (z. B. 30 Tage).</div>`:''}
    <div class="grid2 mt2">${existing?`<button class="btn danger" id="f-del">Löschen</button>`:`<button class="btn ghost" data-act="close">Abbrechen</button>`}<button class="btn" id="f-save">Speichern</button></div>`;
  const read=s=>{
    const q=id=>s.querySelector(id);
    h.name=q('#f-name').value.trim();
    if(q('#f-target'))h.target=Math.max(0.01,parseFloat(q('#f-target').value)||1);
    if(q('#f-unit'))h.unit=q('#f-unit').value.trim();
    if(q('#f-step'))h.step=Math.max(0.01,parseFloat(q('#f-step').value)||1);
    if(q('#f-start')){h.start=q('#f-start').value||null;h.end=q('#f-end').value||null}
    if(q('#f-pause')){const tk=dkey(today()),v=q('#f-pause').value;let ps=(h.pauses||[]).filter(p=>p.to&&p.to<tk).concat((h.pauses||[]).filter(p=>p.from<tk&&(!p.to||p.to>=tk)).map(p=>({...p,to:dkey(addDays(today(),-1))})));if(v&&v>=tk)ps.push({from:tk,to:v});h.pauses=ps}
  };
  const mount=s=>{
    s.onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.e){read(s);h.emoji=b.dataset.e}
      else if(b.dataset.c){read(s);h.color=b.dataset.c}
      else if(b.parentNode.id==='f-type'){read(s);h.type=b.dataset.v;if(h.type==='count'&&(!h.target||h.target<=1))h.target=1}
      else if(b.parentNode.id==='f-freq'){read(s);h.freq.kind=b.dataset.v}
      else if(b.parentNode.id==='f-days'){read(s);const i=+b.dataset.i;h.freq.days=h.freq.days.includes(i)?h.freq.days.filter(x=>x!==i):[...h.freq.days,i]}
      else if(b.parentNode.id==='f-times'){read(s);h.freq.times=+b.dataset.n}
      else if(b.id==='f-save'){
        read(s);
        if(!h.name){toast('Bitte einen Namen eingeben');return}
        if(h.freq.kind==='days'&&!h.freq.days.length){toast('Mindestens einen Tag wählen');return}
        if(h.end&&h.start&&h.end<h.start){toast('Ende liegt vor dem Start');return}
        if(h.type==='check'){h.target=1}
        const f={kind:h.freq.kind};if(f.kind==='days')f.days=h.freq.days.slice().sort();if(f.kind==='weekly')f.times=h.freq.times;h.freq=f;
        closeModal();onSave(h);return;
      }else if(b.id==='f-del'){confirmBox(`„${h.name||existing.name}“ löschen?`,'Löschen',()=>onSave(null));return}
      else return;
      s.innerHTML=draw();
    };
  };
  openModal(draw(),mount);
  setTimeout(()=>{const n=$('#f-name');if(n&&!existing)n.focus()},50);
}
function valueEditor(ctx,code,hid,k){
  const h=findHabit(ctx,code,hid);if(!h)return;
  const v=getVal(ctx,code,hid,k),d=parse(k);
  openModal(`<h3>${ico(h)} ${esc(h.name)}</h3><div class="note">${DAYS_L[wd(d)]}, ${d.getDate()}. ${MON_L[d.getMonth()]} · Ziel ${fmt(h.target)} ${esc(h.unit||'')}</div>
    <div class="row mt2"><button class="cbtn" id="vm" style="width:52px;height:52px">−</button><input id="vv" type="number" inputmode="decimal" step="any" min="0" value="${v}" style="text-align:center;font-size:22px;font-weight:700"><button class="cbtn" id="vp" style="width:52px;height:52px">+</button></div>
    <div class="grid2 mt2"><button class="btn ghost" id="vt">Ziel erreicht</button><button class="btn" id="vs">Speichern</button></div>`,
  s=>{
    const inp=s.querySelector('#vv'),st=+h.step||1;
    s.querySelector('#vm').onclick=()=>inp.value=Math.max(0,Math.round(((parseFloat(inp.value)||0)-st)*100)/100);
    s.querySelector('#vp').onclick=()=>inp.value=Math.round(((parseFloat(inp.value)||0)+st)*100)/100;
    s.querySelector('#vt').onclick=()=>{closeModal();change(ctx,code,hid,k,+h.target)};
    s.querySelector('#vs').onclick=()=>{closeModal();change(ctx,code,hid,k,Math.max(0,parseFloat(inp.value)||0))};
  });
}

/* ---------- groups ---------- */
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function createGroup(){
  let emoji='i:users';const EM=['users','dumbbell','fire','trophy','book','walk','coin','target','heart','briefcase'];
  const draw=()=>`<h3>Gruppe erstellen</h3><div class="lbl">Name</div><input id="g-name" maxlength="30" placeholder="z. B. Gym Bros, Familie"><div class="lbl">Symbol</div><div class="emojis" id="g-em">${EM.map(e=>`<button class="emo li ${emoji==='i:'+e?'on':''}" data-e="i:${e}">${I(LI[e])}</button>`).join('')}</div><div class="grid2 mt2"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn" id="g-ok">Erstellen</button></div>`;
  openModal(draw(),s=>{
    s.querySelector('#g-em').onclick=e=>{const b=e.target.closest('[data-e]');if(!b)return;emoji=b.dataset.e;s.querySelectorAll('#g-em .emo').forEach(x=>x.classList.toggle('on',x===b))};
    s.querySelector('#g-ok').onclick=async()=>{
      const name=s.querySelector('#g-name').value.trim();if(!name){toast('Bitte Namen eingeben');return}
      const btn=s.querySelector('#g-ok');btn.disabled=true;btn.textContent='…';
      try{
        let code=genCode();
        for(let i=0;i<5;i++){const ex=await db.doc(`groups/${code}`).get();if(!ex.exists)break;code=genCode()}
        const g={name,emoji,code,createdBy:ME,createdAt:Date.now(),habits:[]};
        await db.doc(`groups/${code}`).set(g);
        GROUPS[code]=g;joinLocal(code);closeModal();V.group=code;render();toast('Gruppe erstellt – teile den Code!');
      }catch(e){btn.disabled=false;btn.textContent='Erstellen';toast(e&&e.code==='invalid_argument'?'Keine Schreibrechte für diese App':'Konnte Gruppe nicht erstellen')}
    };
    setTimeout(()=>s.querySelector('#g-name').focus(),50);
  });
}
function joinLocal(code){const g=clone(myGM());g.groups=g.groups||[];if(!g.groups.includes(code))g.groups.push(code);g.logs=g.logs||{};GM[ME]=g;saveGM()}
function joinGroup(){
  openModal(`<h3>Gruppe beitreten</h3><div class="lbl">Gruppencode</div><input id="j-code" maxlength="6" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:.2em;font-size:20px;text-align:center"><div class="grid2 mt2"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn" id="j-ok">Beitreten</button></div>`,s=>{
    s.querySelector('#j-ok').onclick=async()=>{
      const code=s.querySelector('#j-code').value.trim().toUpperCase();
      if(code.length<4){toast('Code eingeben');return}
      try{
        const d=await db.doc(`groups/${code}`).get();
        if(!d.exists){toast('Keine Gruppe mit diesem Code gefunden');return}
        GROUPS[code]=clone(d.data());joinLocal(code);closeModal();V.group=code;render();toast(`Willkommen in „${GROUPS[code].name}“`);
      }catch(e){toast('Beitreten fehlgeschlagen')}
    };
    setTimeout(()=>s.querySelector('#j-code').focus(),50);
  });
}

const A={

  statHabit:d=>{V.statHabit=d.id;render()},
  gotoDay:d=>{V.date=parse(d.k);go('heute')},

  dec:d=>{const h=findHabit(d.ctx,d.code,d.hid);change(d.ctx,d.code,d.hid,d.k,Math.max(0,Math.round((getVal(d.ctx,d.code,d.hid,d.k)-(+h.step||1))*100)/100))},
  setval:d=>valueEditor(d.ctx,d.code,d.hid,d.k),
  cell:d=>{const h=findHabit(d.ctx,d.code,d.hid);if(!h)return;if(h.type==='count')valueEditor(d.ctx,d.code,d.hid,d.k);else A.toggle(d)},
  showGroups:d=>{S.settings.showGroups=d.v==='1';saveApp();render()},
  reviewSeen:d=>{S.settings.reviewSeen=d.k;saveApp();render()},
  nudgeSeen:()=>{S.settings.nudgeSeen=Date.now();saveApp();render()},

  newMetric:()=>metricEditor(null),
  metricEdit:d=>metricEditor((S.metrics||[]).find(m=>m.id===d.id)),
  metricEntry:d=>metricEntry(d.id),
  startPause:()=>{let reason='Urlaub';const draw=()=>`<h3>Pause einlegen</h3><div class="seg" id="p-r"><button class="${reason==='Urlaub'?'on':''}" data-r="Urlaub">Urlaub</button><button class="${reason==='Krank'?'on':''}" data-r="Krank">Krank</button><button class="${reason==='Pause'?'on':''}" data-r="Pause">Sonstiges</button></div><div class="lbl">Bis einschließlich</div><input id="p-to" type="date" min="${dkey(today())}" value="${dkey(addDays(today(),6))}"><div class="note" style="margin-top:8px">Alle deine Gewohnheiten pausieren. Deine Serien bleiben erhalten, die Tage zählen nicht in die Statistik.</div><div class="grid2 mt2"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn" id="p-ok">Pausieren</button></div>`;
    openModal(draw(),s=>{s.querySelector('#p-r').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;reason=b.dataset.r;s.querySelectorAll('#p-r button').forEach(x=>x.classList.toggle('on',x===b))};
      s.querySelector('#p-ok').onclick=()=>{const to=s.querySelector('#p-to').value;if(!to){toast('Datum wählen');return}S.settings.pauses=[...(S.settings.pauses||[]),{from:dkey(today()),to,reason}];saveApp();closeModal();render();toast('Pause aktiv')}})},
  endPause:()=>{const tk=dkey(today()),y=dkey(addDays(today(),-1));S.settings.pauses=(S.settings.pauses||[]).map(p=>(tk>=p.from&&(!p.to||tk<=p.to))?(p.from===tk?null:{...p,to:y}):p).filter(Boolean);saveApp();render();toast('Pause beendet')},
  toggleColorful:()=>{S.settings.colorful=!S.settings.colorful;saveApp();render()},
  toggleShowGroups:()=>{S.settings.showGroups=!S.settings.showGroups;saveApp();render()},
  hideGroup:d=>{const h=S.settings.hidden||[];S.settings.hidden=h.includes(d.code)?h.filter(x=>x!==d.code):[...h,d.code];saveApp();render()},
  newHabit:()=>habitEditor(null,h=>{h.start=dkey(today());S.habits.push(h);saveApp();render();toast('Gewohnheit hinzugefügt')}),
  editHabit:d=>{const ex=S.habits.find(h=>h.id===d.id);habitEditor(ex,h=>{if(!h)S.habits=S.habits.filter(x=>x.id!==d.id);else S.habits=S.habits.map(x=>x.id===d.id?{...h,start:ex.start}:x);saveApp();render()})},
  moveHabit:d=>{const i=S.habits.findIndex(h=>h.id===d.id),j=i+(+d.n);if(j<0||j>=S.habits.length)return;[S.habits[i],S.habits[j]]=[S.habits[j],S.habits[i]];saveApp();render()},
  onbToggle:d=>{const i=+d.i;onbSel.has(i)?onbSel.delete(i):onbSel.add(i);render()},
  onbDone:()=>{
    const st=dkey(today());
    [...onbSel].sort((a,b)=>a-b).forEach((i,n)=>{const p=PRESETS[i];S.habits.push({id:uid(),name:p.name,emoji:p.emoji,color:COLORS[0],type:p.type,target:p.target||1,unit:p.unit||'',step:p.step||1,freq:p.freq||{kind:'daily'},start:st})});
    if(!S.habits.length){toast('Wähle mindestens eine Gewohnheit');return}
    S.onboarded=true;onbSel.clear();saveApp();go('heute');
  },
  createGroup:()=>createGroup(),
  joinGroup:()=>joinGroup(),
  openGroup:d=>{V.group=d.code;render();scrollTo(0,0)},
  closeGroup:()=>{V.group=null;render()},
  copyCode:async d=>{try{await navigator.clipboard.writeText(d.code);toast('Code kopiert')}catch(e){toast('Code: '+d.code)}},
  newGroupHabit:d=>habitEditor(null,h=>{const g=clone(GROUPS[d.code]);h.createdBy=ME;if(!h.start)h.start=dkey(today());g.habits=[...(g.habits||[]),h];GROUPS[d.code]=g;saveGroup(d.code);render()},{group:true}),
  editGroupHabit:d=>{const g=GROUPS[d.code],ex=(g.habits||[]).find(h=>h.id===d.hid);habitEditor(ex,h=>{const ng=clone(g);ng.habits=h?ng.habits.map(x=>x.id===d.hid?{...h,createdBy:ex.createdBy}:x):ng.habits.filter(x=>x.id!==d.hid);GROUPS[d.code]=ng;saveGroup(d.code);render()},{group:true})},
  leaveGroup:d=>confirmBox(`„${GROUPS[d.code].name}“ verlassen?`,'Verlassen',()=>{const g=clone(myGM());g.groups=(g.groups||[]).filter(x=>x!==d.code);if(g.logs)delete g.logs[d.code];GM[ME]=g;saveGM();V.group=null;render();toast('Gruppe verlassen')}),
  export:async()=>{const data=JSON.stringify({app:'routine-tracker',v:1,habits:S.habits,settings:S.settings,metrics:S.metrics||[],mdata:S.mdata||{},logs:LOGS});
    if(!inClaude()){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=`routine-backup-${dkey(today())}.json`;document.body.appendChild(a);a.click();a.remove();toast('Backup gespeichert');return}catch(e){}}
    try{await navigator.clipboard.writeText(data);toast('Backup in Zwischenablage kopiert')}catch(e){toast('Kopieren nicht möglich')}},
  import:()=>openModal(`<h3>Backup laden</h3><p class="note">Wähle die Backup-Datei oder füge den kopierten Text ein. Deine aktuellen Daten werden ersetzt.</p><input type="file" id="im-f" accept=".json,application/json" style="margin-top:8px"><textarea id="im-t" placeholder="oder Backup-Text einfügen" style="width:100%;min-height:110px;margin-top:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:13px"></textarea><div class="grid2 mt2"><button class="btn ghost" data-act="close">Abbrechen</button><button class="btn" id="im-ok">Laden</button></div>`,s=>{
    s.querySelector('#im-f').onchange=async e=>{const f=e.target.files[0];if(f)s.querySelector('#im-t').value=await f.text()};
    s.querySelector('#im-ok').onclick=()=>{try{const o=JSON.parse(s.querySelector('#im-t').value);if(!Array.isArray(o.habits))throw 0;
      const years=new Set(Object.keys(LOGS).concat(Object.keys(o.logs||{})).map(k=>k.slice(0,4)));
      S.habits=o.habits;if(o.settings)S.settings=Object.assign({showGroups:true,hidden:[]},o.settings);S.metrics=o.metrics||[];S.mdata=o.mdata||{};LOGS=o.logs||{};S.onboarded=true;
      saveApp();years.forEach(y=>saveLog(y+'-01-01'));closeModal();render();toast('Backup geladen')}catch(e){toast('Ungültiges Backup')}}}),
  reset:()=>confirmBox('Alle deine Gewohnheiten und Haken löschen?','Alles löschen',()=>{
    const years=new Set(Object.keys(LOGS).map(k=>k.slice(0,4)));
    S={habits:[],settings:{showGroups:true,hidden:[]},onboarded:false};LOGS={};saveApp();years.forEach(y=>saveLog(y+'-01-01'));render();toast('Gelöscht');
  }),
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){f(el.dataset,el,e)}
});

/* ---------- tooltip ---------- */
const tip=$('#tip');
let tipT;
document.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const el=e.target.closest('[data-tip]');if(!el||!el.dataset.tip){tip.style.opacity=0;return}tip.textContent=el.dataset.tip;tip.style.opacity=1});
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const el=e.target.closest('[data-tip]');if(!el||!el.dataset.tip||el.dataset.act)return;tip.textContent=el.dataset.tip;tip.style.opacity=1;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,Math.max(8,e.clientX-w/2))+'px';tip.style.top=(e.clientY-50)+'px';clearTimeout(tipT);tipT=setTimeout(()=>tip.style.opacity=0,1600)});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'&&tip.style.opacity==='1'){const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,Math.max(8,e.clientX-w/2))+'px';tip.style.top=(e.clientY-42)+'px'}});
document.addEventListener('pointerout',e=>{if(e.pointerType==='touch')return;if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tip]'))tip.style.opacity=0});
document.addEventListener('scroll',()=>tip.style.opacity=0,true);

/* ---------- swipe ---------- */
let sw=null;
document.getElementById('app').addEventListener('touchstart',e=>{if(e.touches.length!==1||$('#modal-root').innerHTML){sw=null;return}const t=e.target;if(t.closest('.mx-wrap,.chips,.chart,input,.months'))
  {sw=null;return}sw={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}},{passive:true});
document.getElementById('app').addEventListener('touchend',e=>{if(!sw)return;const dx=e.changedTouches[0].clientX-sw.x,dy=e.changedTouches[0].clientY-sw.y;const ok=Math.abs(dx)>70&&Math.abs(dy)<45&&Date.now()-sw.t<600;sw=null;if(!ok)return;
  const n=dx<0?1:-1;
  if(V.tab==='heute'){const d=addDays(V.date,n);if(d<=today()){V.date=d;render()}}
  else if(V.tab==='woche'){if(V.matrix==='woche')V.weekOff+=n;else if(V.matrix==='monat')V.monthOff=(V.monthOff||0)+n;else V.year+=n;render()}
},{passive:true});

/* ---------- nav & render ---------- */
const TABS=[['heute','Heute','today'],['woche','Übersicht','week'],['statistik','Statistik','stats'],['gruppen','Gruppen','groups'],['einstellungen','Mehr','settings']];
function go(t){V.tab=t;try{history.replaceState(null,'','#'+t)}catch(e){location.hash=t}render();scrollTo(0,0)}
function renderNav(){
  const nav=$('#tabs');
  if(!S.onboarded){nav.style.display='none';return}
  nav.style.display='';
  nav.innerHTML=TABS.map(([id,l,ic])=>`<button class="${V.tab===id?'on':''}" data-tab="${id}">${ICON[ic]}<span>${l}</span></button>`).join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){if(b.dataset.tab==='heute'&&V.tab==='heute')V.date=today();go(b.dataset.tab)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==V.tab){V.tab=h;render()}});
function render(){
  CHARTS=[];
  const views={heute:viewHeute,woche:viewWoche,jahr:()=>{V.matrix='jahr';V.tab='woche';return viewWoche()},statistik:viewStats,gruppen:viewGruppen,einstellungen:viewSettings};
  $('#app').innerHTML=S.onboarded?(views[V.tab]||viewHeute)():viewOnboarding();
  document.body.classList.toggle('mono',!S.settings.colorful);document.body.classList.toggle('nb',!!window.__STANDALONE);renderNav();drawCharts();
  const w=document.querySelector('.mx-wrap'),th=w&&w.querySelector('th.td');if(w&&th&&w.scrollWidth>w.clientWidth)w.scrollLeft=Math.max(0,th.offsetLeft-w.clientWidth*0.6);
}
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(drawCharts,150)});

/* ---------- load ---------- */
function applyState(o){
  if(!o)return;
  if(o.habits)S.habits=o.habits;
  if(o.settings)S.settings=Object.assign({showGroups:true,hidden:[]},o.settings);
  S.metrics=o.metrics||S.metrics||[];S.mdata=o.mdata||S.mdata||{};
  S.onboarded=!!o.onboarded||(S.habits.length>0);
}
async function ensureYear(y){
  if(MODE!=='cloud'||loadedYears.has(y))return;
  loadedYears.add(y);
  try{const d=await withTimeout(db.doc(`data/users/${ME}/log-${y}`).get());if(d.exists){Object.assign(LOGS,clone(d.data().logs));render()}}catch(e){}
}
async function loadCloud(){
  const y=new Date().getFullYear();
  const [app,a,b]=await withTimeout(Promise.all([db.doc(`data/users/${ME}/app`).get(),db.doc(`data/users/${ME}/log-${y}`).get(),db.doc(`data/users/${ME}/log-${y-1}`).get()]));
  loadedYears.add(y);loadedYears.add(y-1);
  if(app.exists){
    applyState(clone(app.data()));
    LOGS={};if(b.exists)Object.assign(LOGS,clone(b.data().logs));if(a.exists)Object.assign(LOGS,clone(a.data().logs));
  }else{
    const loc=readLocal(ME)||readLocal('local');
    if(loc&&loc.S&&loc.S.habits&&loc.S.habits.length){applyState(loc.S);LOGS=loc.LOGS||{};saveApp();new Set(Object.keys(LOGS).map(k=>k.slice(0,4))).forEach(yy=>saveLog(yy+'-01-01'))}
  }
  cacheLocal();
}
function subscribe(){
  const gT=setTimeout(()=>{if(!groupsReady){groupsReady=true;if(V.tab==='gruppen')render()}},10000);
  db.collection('groups').onSnapshot(s=>{
    const n={};s.docs.forEach(d=>{n[d.id]=pending(`groups/${d.id}`)&&GROUPS[d.id]?GROUPS[d.id]:clone(d.data())});
    for(const c in GROUPS)if(!n[c]&&pending(`groups/${c}`))n[c]=GROUPS[c];
    GROUPS=n;if(!s.metadata.fromCache){groupsReady=true;clearTimeout(gT)}rerenderSoft();
  },()=>{groupsReady=true;rerenderSoft()});
  db.collection('gm').onSnapshot(s=>{
    const n={};s.docs.forEach(d=>{n[d.id]=d.id===ME&&pending(`gm/${ME}`)&&GM[ME]?GM[ME]:clone(d.data())});
    if(!n[ME]&&GM[ME])n[ME]=GM[ME];
    GM=n;resolveNames(Object.keys(GM));rerenderSoft();
  },()=>{});
}
async function resolveNames(ids){
  if(!user||!user.profiles)return;
  const need=ids.filter(id=>!(id in NAMES));if(!need.length)return;
  need.forEach(id=>NAMES[id]='');
  try{const ps=await user.profiles(need);need.forEach(id=>{NAMES[id]=(ps&&ps[id]&&ps[id].name)||''});rerenderSoft()}catch(e){}
}
function rerenderSoft(){
  const a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&$('#app').contains(a))return;
  render();
}
async function init(){
  let c=window.claude;
  for(let i=0;i<(window.__STANDALONE?0:15)&&!(c&&c.use);i++){await new Promise(r=>setTimeout(r,100));c=window.claude}
  if(c&&c.use){
    try{[db,user]=await Promise.all([withTimeout(c.use('db')).catch(()=>null),withTimeout(c.use('user')).catch(()=>null)])}catch(e){db=null}
  }
  if(db&&user){try{ME=await user.id()}catch(e){ME=null}}
  if(db&&ME){
    MODE='cloud';
    try{const cw=user.can?await user.can('data.write'):null;canWrite=cw!==false}catch(e){}
    try{await loadCloud()}catch(e){
      MODE='local';const loc=readLocal(ME)||readLocal('local');if(loc){applyState(loc.S);LOGS=loc.LOGS||{}}
      toast('Server nicht erreichbar – lokaler Modus');
    }
    if(MODE==='cloud'){subscribe();NAMES[ME]='';resolveNames([ME])}
  }else{
    MODE='local';ME=null;const loc=readLocal('local');if(loc){applyState(loc.S);LOGS=loc.LOGS||{}}
  }
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))V.tab=h;
  render();
}
init();
</script>
</body>
</html>
